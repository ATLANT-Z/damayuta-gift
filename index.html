<style>
  :root {
    --background-deep: #3a3042;
    --ivory: #f1ebf2;
    --gold: #b98b3e;
    --gold-light: #e2bd6b;
    --gold-highlight: #f9e8b4;
    --silver-light: #f2f2f6;
    --silver-mid: #a9a9b4;
    --accent-red: #e0101e;
    --card-ratio: 2480 / 1747;
    --card-radius: 10px;
    --front-image: url("front.webp");
    --back-image: url("back.webp");
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--background-deep);
    color: var(--silver-light);
    font-family: "Oswald", "Arial Narrow", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  /* ---------- Фон ---------- */
  .stage-background {
    position: fixed; inset: 0;
    background:
      linear-gradient(rgba(20, 14, 26, .18), rgba(20, 14, 26, .18)),
      url("background.webp") center / cover no-repeat,
      var(--background-deep);
  }

  /* ---------- Звёздная пыль поверх фона: мелкие звёзды и несколько мерцающих ---------- */
  .star-field {
    position: fixed; inset: 0;
    background-repeat: repeat;
    pointer-events: none;
  }
  .star-field--dust { background-image: var(--star-dust, none); background-size: 480px 480px; }
  .star-field--twinkle { background-image: var(--star-twinkle, none); background-size: 720px 720px; will-change: opacity; }
  .star-field--twinkle-a { animation: star-twinkle 4.2s ease-in-out infinite alternate; }
  .star-field--twinkle-b { background-position: 360px 210px; animation: star-twinkle 5.6s ease-in-out -2.8s infinite alternate; }
  @keyframes star-twinkle { from { opacity: .25; } to { opacity: 1; } }

  /* ---------- Знаки зодиака: круг за карточкой и кольцо вокруг печати ---------- */
  .zodiac-glyph {
    position: absolute; left: 50%; top: 50%;
    fill: none; stroke: var(--gold-light); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round;
    overflow: visible;
    transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(-1 * var(--ring-radius)));
  }
  .zodiac-wheel {
    --wheel-size: min(128vmin, 1180px);
    --ring-radius: calc(var(--wheel-size) * .44);
    position: fixed; left: 50%; top: 50%;
    width: var(--wheel-size); height: var(--wheel-size);
    margin: calc(var(--wheel-size) / -2) 0 0 calc(var(--wheel-size) / -2);
    border-radius: 50%;
    border: 1px solid rgba(226, 189, 107, .5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 2.4s ease;
    animation: slow-spin 360s linear infinite;
    will-change: transform;
  }
  .zodiac-wheel::before {
    content: ""; position: absolute; inset: 12%;
    border-radius: 50%;
    border: 1px solid rgba(226, 189, 107, .4);
  }
  /* деления между знаками */
  .zodiac-wheel::after {
    content: ""; position: absolute; inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(from 15deg, rgba(226, 189, 107, .55) 0deg .3deg, transparent .3deg 30deg);
    -webkit-mask-image: radial-gradient(circle, transparent 0 75.6%, #000 76% 99.6%, transparent 100%);
            mask-image: radial-gradient(circle, transparent 0 75.6%, #000 76% 99.6%, transparent 100%);
  }
  .zodiac-wheel .zodiac-glyph { width: calc(var(--wheel-size) * .038); height: calc(var(--wheel-size) * .038); opacity: .9; }
  body.is-revealed .zodiac-wheel { opacity: .42; }
  @media (orientation: portrait) and (max-width: 700px) {
    .zodiac-wheel { --wheel-size: 150vw; }
  }

  .gift-zodiac { position: absolute; inset: 0; --ring-radius: 104px; }
  .gift-zodiac .zodiac-glyph { width: 15px; height: 15px; opacity: .85; }

  /* ---------- Звёздочки по углам экрана ---------- */
  .corner-star {
    position: fixed; z-index: 12;
    width: 46px; height: 46px;
    overflow: visible;
    pointer-events: none;
    opacity: .85;
  }
  .corner-star path { fill: url(#gold-gradient); }
  .corner-star--top-left { top: 22px; left: 22px; }
  .corner-star--top-right { top: 22px; right: 22px; transform: scaleX(-1); }
  .corner-star--bottom-right { bottom: 22px; right: 22px; transform: scale(-1, -1); }
  .corner-star--bottom-left { bottom: 22px; left: 22px; transform: scaleY(-1); }
  @media (max-width: 600px) {
    .corner-star { width: 30px; height: 30px; }
    .corner-star--top-left, .corner-star--top-right { top: 14px; }
    .corner-star--bottom-left, .corner-star--bottom-right { bottom: 14px; }
    .corner-star--top-left, .corner-star--bottom-left { left: 14px; }
    .corner-star--top-right, .corner-star--bottom-right { right: 14px; }
  }

  #cursor-constellations { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 14; }

  @keyframes slow-spin { to { transform: rotate(360deg); } }

  #sparkle-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }

  /* ---------- Сцена ---------- */
  .card-stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(26px, 5vh, 52px);
    perspective: 1800px;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }

  .card-holder { position: relative; }
  .card-slot {
    position: relative;
    perspective: 1800px;
    width: min(calc(100vw - 72px), calc((100vh - 300px) * 1.4196), 860px);
    aspect-ratio: var(--card-ratio);
    touch-action: none;
    cursor: grab;
    outline: none;
  }
  .card-slot.is-grabbing { cursor: grabbing; }
  @supports (height: 100svh) {
    .card-slot { width: min(calc(100vw - 72px), calc((100svh - 300px) * 1.4196), 860px); }
  }
  @media (max-height: 520px) {
    .card-slot { width: min(calc(100vw - 72px), calc((100vh - 40px) * 1.4196), 860px); }
    .exhibit-heading, .exhibit-label { display: none !important; }
  }
  /* Телефон вертикально: горизонтальная карточка ложится боком и занимает почти весь экран, как билет */
  .exhibit-hint-sideways { display: none; }
  @media (orientation: portrait) and (max-width: 700px) {
    :root { --slot-long: min(calc((100vw - 36px) * 1.4196), calc(100vh - 230px)); }
    @supports (height: 100svh) {
      :root { --slot-long: min(calc((100vw - 36px) * 1.4196), calc(100svh - 230px)); }
    }
    .card-holder { width: calc(var(--slot-long) / 1.4196); height: var(--slot-long); }
    .card-slot {
      position: absolute; left: 50%; top: 50%;
      width: var(--slot-long);
      transform: translate(-50%, -50%) rotate(90deg);
    }
    .card-shadow { display: none; }
    .exhibit-hint-wide { display: none; }
    .exhibit-hint-sideways { display: inline; }
  }

  .card-shadow {
    position: absolute; left: 10%; right: 10%; bottom: -9%; height: 14%;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.7) 0%, rgba(0,0,0,.35) 50%, transparent 100%);
    opacity: 0;
    pointer-events: none;
  }

  .floating-frame {
    position: absolute; inset: -16px;
    border: 1px solid;
    border-image: linear-gradient(115deg, #8a6325 0%, #b98b3e 45%, #e2bd6b 75%, #f9e8b4 100%) 1;
    opacity: 0;
    pointer-events: none;
    transform: rotate(1.4deg);
    transition: opacity 1.2s ease;
    animation: floating-frame-drift 9s ease-in-out infinite;
  }
  body.is-ready .floating-frame { opacity: 1; }
  @keyframes floating-frame-drift {
    0%, 100% { transform: translateY(0) rotate(1.4deg); }
    50%      { transform: translateY(-0.6vmin) rotate(0.9deg); }
  }

  .card-entrance, .card-float, .card-tilt {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
  }
  .card-entrance { transform: scale(0.001); will-change: transform; }
  .card-float { animation: card-float-idle 6s ease-in-out infinite; }
  @keyframes card-float-idle {
    0%, 100% { transform: translateY(0) rotateZ(-0.5deg); }
    50%      { transform: translateY(-1.4vmin) rotateZ(0.5deg); }
  }
  .card-tilt { will-change: transform; }

  /* Книжная страница из полос — гнётся при перелистывании */
  .card-book, .book-page { position: absolute; inset: 0; transform-style: preserve-3d; }

  .card-cast-shadow {
    position: absolute; inset: 5% 4%;
    border-radius: 3%;
    background: rgba(0,0,0,.42);
    box-shadow: 0 0 34px 22px rgba(0,0,0,.42);
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
  }
  .page-strip {
    position: absolute; top: 0; height: 100%;
    transform-style: preserve-3d;
    transform-origin: 0 50%;
  }
  .page-strip-face {
    position: absolute; top: 0; height: 100%;
    background-color: #050506;
    background-repeat: no-repeat;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }
  .page-strip-face--front { background-image: var(--front-image); }
  .page-strip-face--back  { background-image: var(--back-image); transform: rotateY(180deg); }
  .page-strip-light { position: absolute; inset: 0; border-radius: inherit; }

  /* Цельная карточка в покое — на ней голографическая фольга */
  .card-solid {
    position: absolute; inset: 0;
    border-radius: var(--card-radius);
    overflow: hidden;
    isolation: isolate;
    background: #050506 center / 100% 100% no-repeat;
    visibility: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12);
  }
  .card-solid.is-active { visibility: visible; }

  .card-foil, .card-glare, .card-sweep {
    position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  }
  .card-foil, .card-glare { overflow: hidden; opacity: 0; }
  .card-foil {
    -webkit-mask-image: var(--foil-mask, none);
            mask-image: var(--foil-mask, none);
    -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
    mix-blend-mode: color;
  }
  .card-glare { mix-blend-mode: overlay; }
  .card-foil-sheen, .card-glare-spot {
    position: absolute; left: -100%; top: -100%; width: 300%; height: 300%;
    will-change: transform;
  }
  .card-foil-sheen {
    /* жемчуг: мягкие пастельные переливы, широкие и плавные */
    background: repeating-linear-gradient(115deg,
      hsl(330, 55%, 75%) 0%, hsl(40, 55%, 75%) 5.5%, hsl(160, 40%, 75%) 11%,
      hsl(205, 55%, 75%) 16.5%, hsl(265, 45%, 77%) 22%, hsl(330, 55%, 75%) 27.5%);
  }
  .card-glare-spot {
    background: radial-gradient(closest-side circle,
      rgba(255,255,255,.55) 0%, rgba(255,255,255,.14) 30%, rgba(0,0,0,.2) 100%);
  }

  .card-edge-shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; will-change: opacity; }
  .card-edge-shade--left   { background: linear-gradient(90deg,  rgba(0,0,0,.5), rgba(0,0,0,0) 70%); }
  .card-edge-shade--right  { background: linear-gradient(270deg, rgba(0,0,0,.5), rgba(0,0,0,0) 70%); }
  .card-edge-shade--top    { background: linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,0) 70%); }
  .card-edge-shade--bottom { background: linear-gradient(0deg,   rgba(0,0,0,.45), rgba(0,0,0,0) 70%); }

  .card-sweep {
    inset: -20%;
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.18) 46%, rgba(255,255,255,.9) 50%, rgba(255,255,255,.18) 54%, transparent 62%);
    transform: translateX(-130%);
    mix-blend-mode: overlay;
  }
  .card-solid.is-sweeping .card-sweep { animation: card-sweep-pass 1.6s cubic-bezier(.45, 0, .25, 1); }
  @keyframes card-sweep-pass { to { transform: translateX(130%); } }

  /* Запасной вариант полей, если не удалось впечатать имена в картинку */
  .card-field {
    position: absolute; display: none; align-items: center;
    padding: 0 1.2%;
    font-family: "Caveat", cursive; font-weight: 600; color: #121216;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1;
    font-size: calc(var(--card-width, 600px) * .036);
  }
  .card-solid.shows-field-fallback .card-field:not(:empty) { display: flex; }
  .card-field--recipient { left: 61.85%; width: 27.9%; top: 29.65%; height: 4.87%; }
  .card-field--sender    { left: 61.85%; width: 27.9%; top: 37.89%; height: 4.87%; }
  .card-field--id        { left: 2.4%; width: 16.4%; top: 91.8%; height: 4.6%; justify-content: center;
                           font-family: "Oswald", sans-serif; font-weight: 500; letter-spacing: .08em;
                           font-size: calc(var(--card-width, 600px) * .019); }

  /* ---------- Надпись над карточкой и табличка под ней ---------- */
  .exhibit-heading, .exhibit-label {
    text-align: center;
    opacity: 0; transform: translateY(10px);
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2, .8, .2, 1);
    pointer-events: none;
  }
  .exhibit-label { transition-delay: .25s; }
  body.is-ready .exhibit-heading, body.is-ready .exhibit-label { opacity: 1; transform: none; }

  .exhibit-eyebrow {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-family: "Forum", "Cormorant Garamond", Georgia, serif;
    font-size: 13px; letter-spacing: .24em; text-transform: uppercase;
    color: var(--gold-light);
  }
  .exhibit-eyebrow::before, .exhibit-eyebrow::after {
    content: ""; width: clamp(28px, 6vw, 64px); height: 1px;
    background: linear-gradient(90deg, rgba(226,189,107,0), var(--gold-light));
  }
  .exhibit-eyebrow::after { transform: scaleX(-1); }
  .exhibit-title {
    margin-top: 8px;
    font-family: "Cormorant Garamond", Garamond, Georgia, serif;
    font-size: clamp(28px, 4.6vw, 46px); font-weight: 600; line-height: 1.05;
    color: var(--ivory);
  }

  .exhibit-label-name {
    font-family: "Cormorant Garamond", Garamond, Georgia, serif;
    font-size: clamp(18px, 2.2vw, 22px); font-style: italic; font-weight: 500;
    color: var(--ivory);
  }
  .exhibit-label-details {
    margin-top: 6px;
    font-family: "Forum", "Cormorant Garamond", Georgia, serif;
    font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
    color: rgba(241, 235, 242, .62);
  }
  .exhibit-label-details:empty { display: none; }
  .exhibit-hint {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-top: 16px;
    font-family: "Forum", "Cormorant Garamond", Georgia, serif;
    font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold-light);
    animation: soft-pulse 3.2s ease-in-out infinite;
  }
  .exhibit-hint::before, .exhibit-hint::after {
    content: ""; width: 4px; height: 4px; background: var(--gold-light); transform: rotate(45deg);
  }
  @keyframes soft-pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }

  /* ---------- Экран-«печать» ---------- */
  .gift-gate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 64px;
    z-index: 10;
    cursor: pointer;
    outline: none;
    transition: opacity .5s ease, visibility .5s;
  }
  body.is-revealed .gift-gate { opacity: 0; visibility: hidden; }

  .gift-seal-wrap {
    position: relative;
    width: 156px; height: 156px;
    animation: gift-seal-breathe 3.2s ease-in-out infinite;
  }
  /* знаки зодиака вокруг печати между двумя тонкими окружностями */
  .gift-seal-ring {
    position: absolute; border-radius: 50%;
    border: 1px solid var(--gold-light);
  }
  .gift-seal-ring--inner { inset: -9px; opacity: .75; }
  .gift-seal-ring--outer { inset: -42px; opacity: .45; }
  .gift-seal {
    position: absolute; inset: 0;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 35% 30%, #fff 0%, #d9d9e4 18%, #7c7c8c 50%, #1d1d24 100%);
    box-shadow: 0 0 0 1px var(--gold), 0 14px 34px rgba(0,0,0,.5);
  }
  .gift-seal-art {
    position: absolute; inset: 0;
    background: var(--seal-image, none) center / cover no-repeat;
    opacity: 0;
    transition: opacity .8s ease;
    animation: slow-spin 36s linear infinite;
  }
  .gift-seal.has-art .gift-seal-art { opacity: 1; }
  .gift-seal::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.35) 0%, transparent 38%),
                radial-gradient(circle, transparent 58%, rgba(0,0,0,.6) 100%);
  }
  @keyframes gift-seal-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  .gift-gate.is-charging .gift-seal-wrap { animation: gift-seal-charge .78s cubic-bezier(.55, 0, .9, .35) forwards; }
  @keyframes gift-seal-charge {
    0%   { transform: scale(1); filter: brightness(1); }
    70%  { transform: scale(.75); filter: brightness(1.6); }
    100% { transform: scale(1.8); filter: brightness(2.2); opacity: 0; }
  }

  .gift-gate-caption { text-align: center; padding: 0 28px; transition: opacity .25s ease; }
  .gift-gate-title {
    font-family: "Cormorant Garamond", Garamond, Georgia, serif;
    font-size: clamp(28px, 7.5vw, 40px); font-weight: 600; line-height: 1.1; letter-spacing: .01em;
    color: #f1ebf2;
  }
  .gift-gate-subtitle {
    margin-top: 14px;
    font-family: "Forum", "Cormorant Garamond", Georgia, serif;
    font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold-light);
    animation: soft-pulse 3.2s ease-in-out infinite;
  }
  .gift-gate.is-charging .gift-gate-caption { opacity: 0; }

  .shockwave {
    position: fixed; left: 50%; top: 50%;
    width: 40vmin; height: 40vmin; margin: -20vmin 0 0 -20vmin;
    border-radius: 50%;
    border: 1px solid var(--gold-highlight);
    opacity: 0; pointer-events: none; z-index: 16;
  }
  .shockwave.is-active { animation: shockwave-expand 1.2s cubic-bezier(.15, .7, .3, 1) forwards; }
  @keyframes shockwave-expand {
    0%   { transform: scale(.08); opacity: 1; }
    100% { transform: scale(4.2); opacity: 0; }
  }

  .screen-flash {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    background: radial-gradient(circle, #fffaf0 0%, #fffaf0 22%, rgba(255,250,240,0) 75%);
    opacity: 0;
  }
  .screen-flash.is-flashing { animation: screen-flash-burst .9s ease-out; }
  @keyframes screen-flash-burst { 0% { opacity: 0; } 10% { opacity: .45; } 100% { opacity: 0; } }

  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (prefers-reduced-motion: reduce) {
    .card-float, .gift-seal-wrap, .gift-seal-art, .star-field, .zodiac-wheel,
    .floating-frame { animation: none !important; }
  }
</style>
</head>

<script>
(() => {
  const prefersReducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rootStyle = document.documentElement.style;
  const DEGREES = Math.PI / 180;
  const clamp = (value, minimum, maximum) => Math.min(maximum, Math.max(minimum, value));
  const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

  /* ---------- Персонализация через ссылку: ?to=Олена&from=Андрій&id=0042 ---------- */
  const urlParameters = new URLSearchParams(location.search);
  const recipientName = (urlParameters.get("to") || "").trim().slice(0, 40);
  const senderName = (urlParameters.get("from") || "").trim().slice(0, 40);
  const certificateId = (urlParameters.get("id") || "").trim().slice(0, 24);
  const hasPersonalFields = Boolean(recipientName || senderName || certificateId);
  document.getElementById("field-recipient").textContent = recipientName;
  document.getElementById("field-sender").textContent = senderName;
  document.getElementById("field-id").textContent = certificateId;
  if (recipientName) {
    document.getElementById("gift-gate-title").textContent = recipientName + ", для вас подарунок";
    document.getElementById("exhibit-title").textContent = recipientName;
  }
  document.getElementById("exhibit-label-details").textContent =
    [senderName && "Від: " + senderName, certificateId && "№ " + certificateId].filter(Boolean).join("  ·  ");

  /* ---------- Подготовка картинок: печать, фольга, имена ---------- */
  const cardSolid = document.getElementById("card-solid");
  const giftSeal = document.getElementById("gift-seal");
  const faceImageUrls = { front: "front.webp", back: "back.webp" };
  const faceFoilMasks = { front: null, back: null };
  let hasBakedFields = false;

  function loadImage(source) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = source;
    });
  }

  function createCanvas(width, height) {
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    return canvas;
  }

  function canvasToObjectUrl(canvas, type, quality) {
    return new Promise((resolve, reject) => {
      try {
        canvas.toBlob(blob => blob ? resolve(URL.createObjectURL(blob)) : reject(new Error("toBlob")), type, quality);
      } catch (error) { reject(error); }
    });
  }

  // Мандала с лицевой стороны, достроенная зеркально до круга
  function buildSealImage(frontImage) {
    const size = 640, half = size / 2;
    const canvas = createCanvas(size, size);
    const context = canvas.getContext("2d");
    const sourceCenterX = frontImage.naturalWidth * 0.5;
    const sourceCenterY = frontImage.naturalHeight * 0.102;
    const sourceRadius = frontImage.naturalWidth * 0.2;
    context.beginPath(); context.arc(half, half, half, 0, Math.PI * 2); context.clip();
    context.fillStyle = "#050506"; context.fillRect(0, 0, size, size);
    context.drawImage(frontImage, sourceCenterX - sourceRadius, sourceCenterY, sourceRadius * 2, sourceRadius, 0, half, size, half);
    context.save();
    context.translate(0, half); context.scale(1, -1);
    context.drawImage(frontImage, sourceCenterX - sourceRadius, sourceCenterY, sourceRadius * 2, sourceRadius, 0, 0, size, half);
    context.restore();
    return canvas.toDataURL("image/jpeg", 0.9);
  }

  // Тонкая золотая строчка по краю — впечатывается в обе стороны, чтобы была и на изогнутой странице
  function drawGoldEdge(context, width, height) {
    const inset = width * 0.016, radius = width * 0.01;
    const gradient = context.createLinearGradient(0, 0, width, height);
    gradient.addColorStop(0, "#f9e8b4");
    gradient.addColorStop(0.3, "#b98b3e");
    gradient.addColorStop(0.55, "#e2bd6b");
    gradient.addColorStop(0.8, "#8a6325");
    gradient.addColorStop(1, "#e2bd6b");
    context.save();
    context.strokeStyle = gradient;
    context.lineWidth = Math.max(2, width * 0.0011);
    context.beginPath();
    if (context.roundRect) context.roundRect(inset, inset, width - inset * 2, height - inset * 2, radius);
    else context.rect(inset, inset, width - inset * 2, height - inset * 2);
    context.stroke();
    context.restore();
  }

  function buildFrontComposite(frontImage) {
    const canvas = createCanvas(frontImage.naturalWidth, frontImage.naturalHeight);
    const context = canvas.getContext("2d");
    context.drawImage(frontImage, 0, 0);
    drawGoldEdge(context, canvas.width, canvas.height);
    return canvasToObjectUrl(canvas, "image/webp", 0.93);
  }

  // Имена вписываются прямо в оборот, чтобы они были и на изогнутой странице
  async function buildBackComposite(backImage) {
    await Promise.all([
      document.fonts.load('600 64px "Caveat"', recipientName + senderName || "a"),
      document.fonts.load('500 40px "Oswald"', certificateId || "0")
    ]).catch(() => {});
    const width = backImage.naturalWidth, height = backImage.naturalHeight;
    const canvas = createCanvas(width, height);
    const context = canvas.getContext("2d");
    context.drawImage(backImage, 0, 0);
    context.fillStyle = "#121216";
    context.textBaseline = "middle";

    function drawFittedText(text, box, fontWeight, fontFamily, sizeRatio, alignment) {
      if (!text) return;
      const boxX = box.left * width, boxY = box.top * height;
      const boxWidth = box.width * width, boxHeight = box.height * height;
      const padding = boxHeight * 0.28;
      let fontSize = boxHeight * sizeRatio;
      context.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
      const measuredWidth = context.measureText(text).width;
      if (measuredWidth > boxWidth - padding * 2) {
        fontSize *= (boxWidth - padding * 2) / measuredWidth;
        context.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
      }
      context.textAlign = alignment;
      const textX = alignment === "center" ? boxX + boxWidth / 2 : boxX + padding;
      context.fillText(text, textX, boxY + boxHeight * 0.54);
    }

    drawFittedText(recipientName, { left: .6185, top: .2965, width: .279, height: .0487 }, 600, '"Caveat", cursive', 1.08, "left");
    drawFittedText(senderName,    { left: .6185, top: .3789, width: .279, height: .0487 }, 600, '"Caveat", cursive', 1.08, "left");
    if ("letterSpacing" in context) context.letterSpacing = `${Math.round(height * 0.0035)}px`;
    drawFittedText(certificateId, { left: .024, top: .918, width: .164, height: .046 }, 500, '"Oswald", sans-serif', 0.62, "center");
    drawGoldEdge(context, width, height);
    return canvasToObjectUrl(canvas, "image/webp", 0.93);
  }

  // Маска фольги: голограмма ложится только на светлое серебро
  function buildFoilMask(image, excludePortrait) {
    const width = 720, height = Math.round(width * image.naturalHeight / image.naturalWidth);
    const canvas = createCanvas(width, height);
    const context = canvas.getContext("2d", { willReadFrequently: true });
    context.drawImage(image, 0, 0, width, height);
    const imageData = context.getImageData(0, 0, width, height);
    const pixels = imageData.data;
    for (let index = 0; index < pixels.length; index += 4) {
      const luminance = (pixels[index] * 0.2126 + pixels[index + 1] * 0.7152 + pixels[index + 2] * 0.0722) / 255;
      const amount = clamp((luminance - 0.34) / 0.48, 0, 1);
      pixels[index] = pixels[index + 1] = pixels[index + 2] = 255;
      pixels[index + 3] = amount * amount * (3 - 2 * amount) * 255;
    }
    context.putImageData(imageData, 0, 0);
    if (excludePortrait) {
      context.globalCompositeOperation = "destination-out";
      context.filter = "blur(5px)";
      context.fillStyle = "#000";
      context.beginPath();
      context.ellipse(width * 0.497, height * 0.725, width * 0.068, height * 0.1, 0, 0, Math.PI * 2);
      context.fill();
      context.beginPath();
      context.moveTo(width * 0.4, height);
      context.lineTo(width * 0.385, height * 0.86);
      context.quadraticCurveTo(width * 0.4, height * 0.79, width * 0.46, height * 0.78);
      context.lineTo(width * 0.54, height * 0.78);
      context.quadraticCurveTo(width * 0.6, height * 0.79, width * 0.615, height * 0.86);
      context.lineTo(width * 0.62, height);
      context.closePath();
      context.fill();
    }
    return canvas.toDataURL("image/png");
  }

  const assetsReady = (async () => {
    const [frontImage, backImage] = await Promise.all([loadImage("front.webp"), loadImage("back.webp")]);
    try { await Promise.all([frontImage.decode(), backImage.decode()]); } catch (error) {}

    try {
      rootStyle.setProperty("--seal-image", `url("${buildSealImage(frontImage)}")`);
      giftSeal.classList.add("has-art");
    } catch (error) { /* file:// — остаётся градиентный шар */ }

    let frontSourceImage = frontImage;
    try {
      const frontUrl = await buildFrontComposite(frontImage);
      frontSourceImage = await loadImage(frontUrl);
      faceImageUrls.front = frontUrl;
      rootStyle.setProperty("--front-image", `url("${frontUrl}")`);
    } catch (error) { /* file:// — без строчки */ }

    let backSourceImage = backImage;
    try {
      const compositeUrl = await buildBackComposite(backImage);
      backSourceImage = await loadImage(compositeUrl);
      faceImageUrls.back = compositeUrl;
      rootStyle.setProperty("--back-image", `url("${compositeUrl}")`);
      hasBakedFields = hasPersonalFields;
    } catch (error) {}

    try {
      faceFoilMasks.front = buildFoilMask(frontSourceImage, true);
      faceFoilMasks.back = buildFoilMask(backSourceImage, false);
    } catch (error) {}

    if (solidShownSide) showSolidSide(solidShownSide);
  })().catch(() => {});

  /* ---------- Искры ---------- */
  const sparkleCanvas = document.getElementById("sparkle-canvas");
  const sparkleContext = sparkleCanvas.getContext("2d");
  let canvasWidth = 0, canvasHeight = 0;
  const sparkleParticles = [];

  function resizeSparkleCanvas() {
    const pixelRatio = 1;
    canvasWidth = innerWidth; canvasHeight = innerHeight;
    sparkleCanvas.width = canvasWidth * pixelRatio;
    sparkleCanvas.height = canvasHeight * pixelRatio;
    sparkleContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  }
  resizeSparkleCanvas();

  function pickSparkleColor() {
    const roll = Math.random();
    return roll < 0.25 ? "249,232,180" : roll < 0.4 ? "226,189,107" : "255,255,255";
  }

  function createAmbientSparkle() {
    return {
      kind: "ambient",
      positionX: Math.random() * canvasWidth, positionY: canvasHeight + 10,
      velocityX: (Math.random() - 0.5) * 0.25, velocityY: -(0.25 + Math.random() * 0.6),
      size: 0.5 + Math.random() * 1.3,
      lifetime: 0, maximumLifetime: 400 + Math.random() * 500,
      twinklePhase: Math.random() * Math.PI * 2,
      color: pickSparkleColor()
    };
  }

  function spawnSparkleBurst(centerX, centerY, particleCount, strength) {
    if (prefersReducedMotion) return;
    for (let index = 0; index < particleCount; index++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (1.2 + Math.random() * 7) * strength;
      sparkleParticles.push({
        kind: "burst",
        positionX: centerX, positionY: centerY,
        velocityX: Math.cos(angle) * speed, velocityY: Math.sin(angle) * speed,
        size: 0.7 + Math.random() * 2,
        lifetime: 0, maximumLifetime: 45 + Math.random() * 75,
        twinklePhase: Math.random() * Math.PI * 2,
        color: pickSparkleColor()
      });
    }
  }

  function spawnConvergingSparkles(centerX, centerY, particleCount, durationFrames) {
    if (prefersReducedMotion) return;
    for (let index = 0; index < particleCount; index++) {
      const angle = Math.random() * Math.PI * 2;
      const distance = 140 + Math.random() * Math.max(canvasWidth, canvasHeight) * 0.45;
      sparkleParticles.push({
        kind: "converge",
        startX: centerX + Math.cos(angle) * distance, startY: centerY + Math.sin(angle) * distance,
        positionX: 0, positionY: 0, targetX: centerX, targetY: centerY,
        swirl: (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random() * 0.6),
        size: 0.8 + Math.random() * 2,
        lifetime: -Math.random() * durationFrames * 0.4, maximumLifetime: durationFrames * (0.55 + Math.random() * 0.45),
        twinklePhase: Math.random() * Math.PI * 2,
        color: pickSparkleColor()
      });
    }
  }

  function drawSparkle(particle, alpha) {
    if (alpha <= 0.01) return;
    const color = `rgba(${particle.color},${alpha.toFixed(3)})`;
    sparkleContext.fillStyle = color;
    sparkleContext.beginPath();
    sparkleContext.arc(particle.positionX, particle.positionY, particle.size, 0, Math.PI * 2);
    sparkleContext.fill();
    if (particle.size > 1.7) { // четырёхлучевой блик для крупных искр
      sparkleContext.strokeStyle = color;
      sparkleContext.lineWidth = 0.7;
      const rayLength = particle.size * 3.4;
      sparkleContext.beginPath();
      sparkleContext.moveTo(particle.positionX - rayLength, particle.positionY);
      sparkleContext.lineTo(particle.positionX + rayLength, particle.positionY);
      sparkleContext.moveTo(particle.positionX, particle.positionY - rayLength);
      sparkleContext.lineTo(particle.positionX, particle.positionY + rayLength);
      sparkleContext.stroke();
    }
  }

  function animateSparkles() {
    sparkleContext.clearRect(0, 0, canvasWidth, canvasHeight);
    sparkleContext.globalCompositeOperation = "lighter";
    const ambientTarget = prefersReducedMotion ? 0 : Math.round((canvasWidth * canvasHeight) / 55000);
    let ambientCount = 0;
    for (const particle of sparkleParticles) if (particle.kind === "ambient") ambientCount++;
    if (ambientCount < ambientTarget && Math.random() < 0.5) sparkleParticles.push(createAmbientSparkle());

    for (let index = sparkleParticles.length - 1; index >= 0; index--) {
      const particle = sparkleParticles[index];
      particle.lifetime++;
      if (particle.lifetime < 0) continue;
      const lifeProgress = particle.lifetime / particle.maximumLifetime;
      const twinkle = 0.55 + 0.45 * Math.sin(particle.lifetime * 0.12 + particle.twinklePhase);
      let alpha;
      if (particle.kind === "converge") {
        const eased = lifeProgress * lifeProgress * lifeProgress;
        const swirlAngle = (1 - eased) * particle.swirl;
        const offsetX = (particle.startX - particle.targetX) * (1 - eased);
        const offsetY = (particle.startY - particle.targetY) * (1 - eased);
        particle.positionX = particle.targetX + offsetX * Math.cos(swirlAngle) - offsetY * Math.sin(swirlAngle);
        particle.positionY = particle.targetY + offsetX * Math.sin(swirlAngle) + offsetY * Math.cos(swirlAngle);
        alpha = Math.min(1, lifeProgress * 4) * twinkle;
      } else {
        particle.positionX += particle.velocityX;
        particle.positionY += particle.velocityY;
        if (particle.kind === "burst") { particle.velocityX *= 0.94; particle.velocityY = particle.velocityY * 0.94 + 0.04; }
        const fade = lifeProgress < 0.15 ? lifeProgress / 0.15 : 1 - Math.max(0, (lifeProgress - 0.6) / 0.4);
        alpha = Math.max(0, fade * twinkle) * (particle.kind === "burst" ? 1 : 0.55);
      }
      drawSparkle(particle, alpha);
      if (particle.lifetime >= particle.maximumLifetime) sparkleParticles.splice(index, 1);
    }
    requestAnimationFrame(animateSparkles);
  }
  requestAnimationFrame(animateSparkles);

  /* ---------- Знаки зодиака по кругу ---------- */
  const ZODIAC_SIGNS = ["aries", "taurus", "gemini", "cancer", "leo", "virgo", "libra", "scorpio", "sagittarius", "capricorn", "aquarius", "pisces"];

  fillZodiacRing(document.getElementById("gift-zodiac"));

  /* ---------- Звёздная пыль на фоне: рисуется один раз плиткой ---------- */
  (function buildStarField() {
    function starTile(size, starCount, drawStar) {
      const canvas = createCanvas(size, size);
      const context = canvas.getContext("2d");
      for (let index = 0; index < starCount; index++) drawStar(context, Math.random() * size, Math.random() * size);
      return canvas.toDataURL("image/png");
    }
    const STAR_COLORS = ["255,255,255", "242,217,155", "226,232,255"];
    const pickColor = () => STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
    const dust = starTile(480, 150, (context, x, y) => {
      context.fillStyle = `rgba(${pickColor()},${(0.18 + Math.random() * 0.5).toFixed(2)})`;
      context.beginPath();
      context.arc(x, y, 0.35 + Math.random() * 0.75, 0, Math.PI * 2);
      context.fill();
    });
    const twinkle = starTile(720, 9, (context, x, y) => {
      const rayLength = 3 + Math.random() * 4;
      const color = pickColor();
      context.fillStyle = `rgba(${color},.9)`;
      context.beginPath();
      context.arc(x, y, 1.1, 0, Math.PI * 2);
      context.fill();
      context.strokeStyle = `rgba(${color},.55)`;
      context.lineWidth = 0.7;
      context.beginPath();
      context.moveTo(x - rayLength, y); context.lineTo(x + rayLength, y);
      context.moveTo(x, y - rayLength); context.lineTo(x, y + rayLength);
      context.stroke();
    });
    rootStyle.setProperty("--star-dust", `url("${dust}")`);
    rootStyle.setProperty("--star-twinkle", `url("${twinkle}")`);
  })();

  /* ---------- Созвездия за курсором: рождаются на пути мыши и быстро тают ---------- */
  (function setupCursorConstellations() {
    if (prefersReducedMotion || !matchMedia("(pointer: fine)").matches) return;
    const canvas = document.getElementById("cursor-constellations");
    const context = canvas.getContext("2d");
    const GOLD = "205, 164, 78", IVORY = "242, 217, 155", TAU = Math.PI * 2;
    let constellations = [], isRunning = false, width = 0, height = 0;
    let lastX = -10000, lastY = -10000, lastTime = 0;

    function resize() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = innerWidth; height = innerHeight;
      canvas.width = width * pixelRatio; canvas.height = height * pixelRatio;
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    function spawn(x, y) {
      // 3–5 звёзд цепочкой — маленькое живое созвездие
      const starCount = 3 + Math.floor(Math.random() * 3);
      const stars = [];
      let pointX = x + (Math.random() - 0.5) * 11, pointY = y + (Math.random() - 0.5) * 11;
      for (let index = 0; index < starCount; index++) {
        stars.push({ x: pointX, y: pointY, radius: 0.7 + Math.random() * 0.8 });
        const angle = Math.random() * TAU, distance = 12 + Math.random() * 20;
        pointX += Math.cos(angle) * distance; pointY += Math.sin(angle) * distance;
      }
      const links = [];
      for (let index = 0; index < starCount - 1; index++) links.push([index, index + 1]);
      if (starCount > 3 && Math.random() > 0.55) links.push([0, starCount - 1]);
      constellations.push({ stars, links, born: performance.now(), life: 620 + Math.random() * 420 });
      if (constellations.length > 18) constellations.shift();
      if (!isRunning) { isRunning = true; requestAnimationFrame(tick); }
    }

    function tick(now) {
      context.clearRect(0, 0, width, height);
      constellations = constellations.filter(item => now - item.born < item.life);
      for (const item of constellations) {
        const progress = (now - item.born) / item.life;
        // резкое появление, быстрое угасание
        const envelope = Math.max(0, progress < 0.16 ? progress / 0.16 : 1 - (progress - 0.16) / 0.84);
        context.lineWidth = 0.8;
        context.strokeStyle = `rgba(${GOLD}, ${0.38 * envelope})`;
        context.beginPath();
        for (const [from, to] of item.links) {
          context.moveTo(item.stars[from].x, item.stars[from].y);
          context.lineTo(item.stars[to].x, item.stars[to].y);
        }
        context.stroke();
        for (const star of item.stars) {
          context.beginPath();
          context.arc(star.x, star.y, star.radius * 2.4, 0, TAU);
          context.fillStyle = `rgba(${GOLD}, ${0.2 * envelope})`;
          context.fill();
          context.beginPath();
          context.arc(star.x, star.y, star.radius, 0, TAU);
          context.fillStyle = `rgba(${IVORY}, ${0.95 * envelope})`;
          context.fill();
        }
      }
      if (constellations.length) requestAnimationFrame(tick); else isRunning = false;
    }

    resize();
    addEventListener("resize", resize);
    addEventListener("pointermove", event => {
      if (event.pointerType === "touch") return;
      const now = performance.now();
      const deltaX = event.clientX - lastX, deltaY = event.clientY - lastY;

      if (deltaX * deltaX + deltaY * deltaY < 3600 || now - lastTime < 55) return;
      lastX = event.clientX; lastY = event.clientY; lastTime = now;
      spawn(event.clientX, event.clientY);
    }, { passive: true });
  })();

  /* ---------- Страница-книга из полос ---------- */
  // Две цепочки полос: с корешком слева и справа — чтобы листать в обе стороны
  const STRIP_COUNT = 14;
  const cardSlot = document.getElementById("card-slot");
  const cardEntrance = document.getElementById("card-entrance");
  const cardTilt = document.getElementById("card-tilt");
  const cardBook = document.getElementById("card-book");
  const cardShadow = document.getElementById("card-shadow");
  const cardCastShadow = document.getElementById("card-cast-shadow");
  const stripAngles = new Float32Array(STRIP_COUNT);
  let cardWidth = 0, cardHeight = 0;

  function buildPageChain(hingeSide) {
    const page = document.createElement("div");
    page.className = "book-page";
    cardBook.append(page);
    const strips = [];
    let parentElement = page;
    for (let index = 0; index < STRIP_COUNT; index++) {
      const strip = document.createElement("div");
      strip.className = "page-strip";
      strip.style.transformOrigin = hingeSide === "left" ? "0 50%" : "100% 50%";
      const frontFace = document.createElement("div");
      frontFace.className = "page-strip-face page-strip-face--front";
      const backFace = document.createElement("div");
      backFace.className = "page-strip-face page-strip-face--back";
      const frontLight = document.createElement("div");
      frontLight.className = "page-strip-light";
      const backLight = document.createElement("div");
      backLight.className = "page-strip-light";
      frontFace.append(frontLight);
      backFace.append(backLight);
      strip.append(frontFace, backFace);
      parentElement.append(strip);
      parentElement = strip;
      strips.push({ strip, frontFace, backFace, frontLight, backLight });
    }
    return { hingeSide, page, strips };
  }
  const pageChains = { left: buildPageChain("left"), right: buildPageChain("right") };
  let activeChain = pageChains.left;
  pageChains.right.page.style.visibility = "hidden";

  function setActiveChain(chain) {
    if (chain === activeChain) return;
    activeChain.page.style.visibility = "hidden";
    chain.page.style.visibility = "visible";
    activeChain = chain;
  }

  function layoutPageStrips() {
    cardWidth = cardSlot.offsetWidth;
    cardHeight = cardSlot.offsetHeight;

    const cornerRadius = Math.max(6, cardWidth * 0.016);
    rootStyle.setProperty("--card-radius", `${cornerRadius}px`);
    rootStyle.setProperty("--card-width", `${cardWidth}px`);
    const backgroundSize = `${cardWidth}px ${cardHeight}px`;
    const sliceRadius = sliceIndex =>
      sliceIndex === 0 ? `${cornerRadius}px 0 0 ${cornerRadius}px`
      : sliceIndex === STRIP_COUNT - 1 ? `0 ${cornerRadius}px ${cornerRadius}px 0` : "0";

    function placeFace(face, sliceIndex, offsetLeft, overlap) {
      face.style.width = `${stripWidth + overlap}px`;
      face.style.left = `${offsetLeft}px`;
      face.style.backgroundSize = backgroundSize;
      face.style.backgroundPosition = `${-sliceIndex * stripWidth - offsetLeft}px 0`;
      face.style.borderRadius = sliceRadius(sliceIndex);

      chain.strips.forEach((pageStrip, index) => {
        const isFirst = index === 0, isLast = index === STRIP_COUNT - 1;
        pageStrip.strip.style.width = `${stripWidth}px`;
        // соседние полосы слегка перекрываются, чтобы не было щелей

          pageStrip.strip.style.left = isFirst ? "0px" : `${stripWidth}px`;
          placeFace(pageStrip.frontFace, index, 0, isLast ? 0 : 1);
          // после переворота полоса у корешка оказывается справа — на ней правый край оборота
          placeFace(pageStrip.backFace, STRIP_COUNT - 1 - index, isFirst ? 0 : -1, isFirst ? 0 : 1);
          pageStrip.backFace.style.backgroundPosition = `${-(STRIP_COUNT - 1 - index) * stripWidth}px 0`;
        } else {
          pageStrip.strip.style.right = isFirst ? "0px" : `${stripWidth}px`;
          placeFace(pageStrip.frontFace, STRIP_COUNT - 1 - index, isLast ? 0 : -1, isLast ? 0 : 1);
          placeFace(pageStrip.backFace, index, isLast ? 0 : -1, isLast ? 0 : 1);
          pageStrip.backFace.style.backgroundPosition = `${-index * stripWidth}px 0`;
        }

    });

  addEventListener("resize", () => { resizeSparkleCanvas(); layoutPageStrips(); });

  // Свет падает чуть справа: грань, отвернувшаяся от света, темнеет, блик скользит по изгибу
  const LIGHT_X = 0.37, LIGHT_Z = Math.sqrt(1 - LIGHT_X * LIGHT_X);

  // иначе слегка согнутые крайние полосы светлели пятном.
  function stripLightColor(brightness, turnAmount) {
    const gleam = clamp((brightness - 0.95) / 0.05, 0, 1) * clamp((turnAmount - 0.3) / 0.3, 0, 1);
    if (gleam > 0.02) return `rgba(255,255,255,${(gleam * gleam * 0.22).toFixed(3)})`;
    return `rgba(0,0,0,${clamp((0.93 - brightness) * 1.1, 0, 0.88).toFixed(3)})`;
  }

  /* ---------- Цельная карточка с фольгой ---------- */
  let isSolidActive = false, solidHasFoilMask = false, solidActivatedTime = 0;
  const cardFoil = document.getElementById("card-foil");
  const cardFoilSheen = document.getElementById("card-foil-sheen");
  const cardGlare = document.getElementById("card-glare");
  const cardGlareSpot = document.getElementById("card-glare-spot");
  const edgeShades = {
    left: document.getElementById("edge-shade-left"), right: document.getElementById("edge-shade-right"),
    top: document.getElementById("edge-shade-top"), bottom: document.getElementById("edge-shade-bottom")
  };
  let solidShownSide = null;

  function showSolidSide(side) {
    solidShownSide = side;
    cardSolid.style.backgroundImage = `url("${faceImageUrls[side]}")`;
    const foilMask = faceFoilMasks[side];
    cardSolid.style.setProperty("--foil-mask", foilMask ? `url("${foilMask}")` : "none");
    solidHasFoilMask = Boolean(foilMask);
    cardSolid.classList.toggle("shows-field-fallback", side === "back" && hasPersonalFields && !hasBakedFields);
  }

  function activateSolid() {
    isSolidActive = true;
    solidActivatedTime = performance.now();
    showSolidSide(flipTarget === 0 ? "front" : "back");
    cardSolid.classList.add("is-active");
    cardBook.style.visibility = "hidden";
    cardSolid.classList.remove("is-sweeping"); void cardSolid.offsetWidth; cardSolid.classList.add("is-sweeping");
  }

  function deactivateSolid() {
    if (!isSolidActive) return;
    isSolidActive = false;
    cardSolid.classList.remove("is-active", "is-sweeping");
    cardFoil.style.opacity = cardGlare.style.opacity = "0";
    Object.values(edgeShades).forEach(shade => { shade.style.opacity = "0"; });
    cardBook.style.visibility = "visible";
  }

  /* ---------- Карточка боком на вертикальном телефоне ---------- */
  const sidewaysQuery = matchMedia("(orientation: portrait) and (max-width: 700px)");
  let isCardSideways = sidewaysQuery.matches;
  const onSidewaysChange = () => { isCardSideways = sidewaysQuery.matches; layoutPageStrips(); };
  if (sidewaysQuery.addEventListener) sidewaysQuery.addEventListener("change", onSidewaysChange);
  else sidewaysQuery.addListener(onSidewaysChange);
  // ось X карточки смотрит на экране вниз, ось Y — влево
  const toCardSpace = (deltaX, deltaY) => isCardSideways ? { x: deltaY, y: -deltaX } : { x: deltaX, y: deltaY };

  /* ---------- Наклон (мышь, палец, гироскоп) ---------- */
  let targetTiltX = 0, targetTiltY = 0, currentTiltX = 0, currentTiltY = 0, smoothedTiltX = 0, smoothedTiltY = 0;
  let isGyroscopeActive = false;

  function setTiltFromRelativePosition(relativeX, relativeY) {
    targetTiltY = (clamp(relativeX, 0, 1) - 0.5) * 24;
    targetTiltX = -(clamp(relativeY, 0, 1) - 0.5) * 20;
  }

  addEventListener("pointermove", event => {
    if (isDragging || isGyroscopeActive) return;
    if (event.pointerType !== "mouse" && dragPointerId === null) return;
    const slotRectangle = cardSlot.getBoundingClientRect();
    const relativeX = (event.clientX - slotRectangle.left) / slotRectangle.width;
    const relativeY = (event.clientY - slotRectangle.top) / slotRectangle.height;
    if (isCardSideways) setTiltFromRelativePosition(relativeY, 1 - relativeX);
    else setTiltFromRelativePosition(relativeX, relativeY);
  });

  // Наклон считается от того, как человек держит телефон: «ноль» запоминается при первом показании
  // и за несколько секунд подстраивается под новую позу. Полный наклон карточки — при наклоне телефона на ~18°.
  const GYRO_RANGE = 18, GYRO_RECENTER = 0.004;
  let gyroBaseline = null, gyroScreenAngle = null;
  function handleDeviceOrientation(event) {
    if (event.gamma == null || event.beta == null) return;
    isGyroscopeActive = true;
    const screenAngle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    const isLandscape = Math.abs(screenAngle) === 90 || screenAngle === 270;
    const sideTilt = isLandscape ? (screenAngle === 90 ? event.beta : -event.beta) : event.gamma;
    const forwardTilt = isLandscape ? (screenAngle === 90 ? -event.gamma : event.gamma) : event.beta;
    if (!gyroBaseline || gyroScreenAngle !== screenAngle) {
      gyroBaseline = { side: sideTilt, forward: forwardTilt };
      gyroScreenAngle = screenAngle;
    }
    gyroBaseline.side += (sideTilt - gyroBaseline.side) * GYRO_RECENTER;
    gyroBaseline.forward += (forwardTilt - gyroBaseline.forward) * GYRO_RECENTER;
    const side = (sideTilt - gyroBaseline.side) / (GYRO_RANGE * 2);
    const forward = (forwardTilt - gyroBaseline.forward) / (GYRO_RANGE * 2);
    if (isCardSideways) setTiltFromRelativePosition(0.5 + forward, 0.5 - side);
    else setTiltFromRelativePosition(0.5 + side, 0.5 + forward);
  }

    if (typeof DeviceOrientationEvent === "undefined") return;
    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission()
        .then(permissionState => { if (permissionState === "granted") addEventListener("deviceorientation", handleDeviceOrientation); })
        .catch(() => {});
    } else {
      addEventListener("deviceorientation", handleDeviceOrientation);
    }
  }

  /* ---------- Перелистывание: тап или свайп в любую сторону ---------- */
  // pageAngle: 0 — лицевая сторона, 180 — оборот. В какую сторону листать, решает цепочка:
  // корешок у левого края — страница уходит влево, у правого — вправо.
  let flipTarget = 0, pageAngle = 0, pageVelocity = 0, pageBend = 0;
  let isDragging = false, dragAngle = 0, dragDirection = 1;
  let dragDeltaX = 0, dragPointerId = null, dragStartX = 0, dragStartY = 0, dragStartAngle = 0, dragSamples = [];
  let entranceStartTime = null, isEntranceDone = false, entranceDoneTime = 0;

  function chainForTurn(isFrontShown, isTurningLeft) {
    return isFrontShown === isTurningLeft ? pageChains.left : pageChains.right;
  }

  // Переворот идёт по времени с плавным разгоном и замедлением — без пружины, перелёта и отскока
  const easeInOutSine = progress => -(Math.cos(Math.PI * progress) - 1) / 2;
  const easeOutCubic = progress => 1 - Math.pow(1 - progress, 3);
  let flipTween = null;
  function startFlipTween(fullDuration, minimumDuration, easing) {
    const distance = Math.abs(flipTarget - pageAngle) / 180;
    flipTween = {
      from: pageAngle, to: flipTarget, start: performance.now(),
      duration: Math.max(minimumDuration, fullDuration * distance), easing
    };
  }

  function toggleFlip(isTurningLeft) {
    if (!isEntranceDone) return;
    deactivateSolid();
    // корешок меняем, только пока страница лежит ровно, иначе её дёрнет на другую сторону
    const isPageFlat = Math.abs(pageAngle - flipTarget) < 4 && Math.abs(pageBend) < 4;
    if (isPageFlat) setActiveChain(chainForTurn(flipTarget === 0, isTurningLeft));
    flipTarget = flipTarget === 0 ? 180 : 0;
    startFlipTween(1250, 500, easeInOutSine);
  }

  // С корешком слева страница листается справа налево — угол растёт при движении пальца влево; с корешком справа — наоборот.
  const angleForChain = (chain, deltaX) =>
    dragStartAngle + ((chain === pageChains.left ? -deltaX : deltaX) / cardWidth) * 190;

  function angleForDrag(deltaX) {
    let angle = angleForChain(activeChain, deltaX);
    // Палец тянет за пределы «лежит ровно» — значит, листаем в другую сторону. Корешок меняем,
    // только пока страница ровная: у ровной страницы обе цепочки выглядят одинаково, и скачка нет.
    if (angle < 0 || angle > 180) {
      const otherChain = activeChain === pageChains.left ? pageChains.right : pageChains.left;
      const otherAngle = angleForChain(otherChain, deltaX);
      const isPageFlat = Math.min(Math.abs(pageAngle), Math.abs(pageAngle - 180)) < 4 && Math.abs(pageBend) < 4;
      if (isPageFlat && otherAngle >= 0 && otherAngle <= 180) {
        setActiveChain(otherChain);
        angle = otherAngle;
      }

      dragStartX = event.clientX; dragStartY = event.clientY;
      dragDeltaX = 0;
      dragStartAngle = pageAngle;
      dragAngle = pageAngle;
      dragSamples = [{ angle: pageAngle, time: event.timeStamp }];

    dragDeltaX = toCardSpace(event.clientX - dragStartX, event.clientY - dragStartY).x;

  cardSlot.addEventListener("lostpointercapture", event => finishPointer(event, true));
  cardSlot.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " " || event.key === "ArrowLeft") { event.preventDefault(); toggleFlip(true); }
    if (event.key === "ArrowRight") { event.preventDefault(); toggleFlip(false); }
  });

  /* ---------- Главный цикл ---------- */
  const ENTRANCE_DURATION = 2200;
    let previousFrameTime = performance.now();
  let lastEntranceTransform = "", lastShadowStyle = "";

  function animateCard(time) {
    const frameScale = clamp((time - previousFrameTime) / 16.667, 0.25, 3);
    previousFrameTime = time;

    // появление: карточка выходит из вспышки одним плавным оборотом и мягко замедляется, без отскока
    let entranceScale = 0.001, entranceSpin = 0;
    if (entranceStartTime !== null) {

    }
    const entranceTransform = `scale(${entranceScale.toFixed(4)}) rotateY(${entranceSpin.toFixed(2)}deg)`;
    if (entranceTransform !== lastEntranceTransform) cardEntrance.style.transform = lastEntranceTransform = entranceTransform;

    // мягкое следование наклону + самопроизвольное покачивание
    const tiltEase = 1 - Math.pow(0.94, frameScale);
    smoothedTiltX += (targetTiltX - smoothedTiltX) * tiltEase;
    smoothedTiltY += (targetTiltY - smoothedTiltY) * tiltEase;
    currentTiltX += (smoothedTiltX - currentTiltX) * tiltEase;
    currentTiltY += (smoothedTiltY - currentTiltY) * tiltEase;
    let idleTiltX = 0, idleTiltY = 0;
    if (!isGyroscopeActive && !prefersReducedMotion) {
      idleTiltY = Math.sin(time / 2300) * 4.5;
      idleTiltX = Math.cos(time / 2900) * 2.6;
    }
    const totalTiltX = currentTiltX + idleTiltX, totalTiltY = currentTiltY + idleTiltY;
    cardTilt.style.transform = `rotateX(${totalTiltX.toFixed(2)}deg) rotateY(${totalTiltY.toFixed(2)}deg)`;

    // пружина страницы: разгон, перелёт и успокоение
    let bendGoal = 0;
    if (isDragging) {
      // под пальцем страница идёт следом с лёгкой задержкой
      flipTween = null;
      dragAngle = angleForDrag(dragDeltaX);
      const physicsSteps = Math.max(1, Math.round(frameScale));
      for (let step = 0; step < physicsSteps; step++) {
        pageVelocity += (dragAngle - pageAngle) * 0.25;
        pageVelocity *= 0.6;
        pageAngle += pageVelocity;
      }
      bendGoal = (dragAngle - pageAngle) * 0.9 + Math.sin(clamp(pageAngle, 0, 180) * DEGREES) * 18 * dragDirection;
    } else if (flipTween) {
      const progress = clamp((time - flipTween.start) / flipTween.duration, 0, 1);
      const previousAngle = pageAngle;
      pageAngle = flipTween.from + (flipTween.to - flipTween.from) * flipTween.easing(progress);
      pageVelocity = (pageAngle - previousAngle) / frameScale;
      // край страницы чуть опережает корешок — мягкий изгиб, который растёт и спадает вместе со скоростью
      bendGoal = pageVelocity * 2.4;
      if (progress >= 1) { flipTween = null; pageVelocity = 0; }
    } else {
      pageAngle += (flipTarget - pageAngle) * (1 - Math.pow(0.85, frameScale));
      pageVelocity = 0;
    }
    pageBend += (clamp(bendGoal, -40, 40) - pageBend) * (1 - Math.pow(0.82, frameScale));

    const isSettled = isEntranceDone && !isDragging
      && Math.abs(pageAngle - flipTarget) < 0.3 && Math.abs(pageVelocity) < 0.05 && Math.abs(pageBend) < 0.3;
    if (isSettled && !isSolidActive) {
      pageAngle = flipTarget; pageVelocity = 0; pageBend = 0;
      activateSolid();
    }

    let liftAmount = 0, projectedWidth = 1;
    if (!isSolidActive) {
      let angleSum = 0;
      for (let index = 0; index < STRIP_COUNT; index++) {
        stripAngles[index] = pageAngle + pageBend * Math.pow(index / (STRIP_COUNT - 1), 1.4);
        angleSum += stripAngles[index];
      }
      const meanAngle = angleSum / STRIP_COUNT;
      const isLeftHinge = activeChain.hingeSide === "left";
      const hingeSign = isLeftHinge ? 1 : -1;
      // корешок едет вместе со страницей, чтобы карточка оставалась по центру
      const hingeOffset = hingeSign * cardWidth / 2 * (1 - Math.cos(meanAngle * DEGREES));
      liftAmount = Math.max(0, Math.sin(meanAngle * DEGREES));
      projectedWidth = Math.abs(Math.cos(meanAngle * DEGREES));
      activeChain.page.style.transform =
        `translate3d(${hingeOffset.toFixed(2)}px, 0, ${(liftAmount * cardWidth * 0.13).toFixed(2)}px)`;

      activeChain.strips.forEach((pageStrip, index) => {
        const relativeAngle = index === 0 ? stripAngles[0] : stripAngles[index] - stripAngles[index - 1];
        pageStrip.strip.style.transform = `rotateY(${(-hingeSign * relativeAngle).toFixed(2)}deg)`;
        const normalAngle = (entranceSpin - hingeSign * stripAngles[index]) * DEGREES;
        const frontBrightness = LIGHT_X * Math.sin(normalAngle) + LIGHT_Z * Math.cos(normalAngle);
        const turnAmount = Math.abs(Math.sin(stripAngles[index] * DEGREES));
        pageStrip.frontLight.style.backgroundColor = stripLightColor(frontBrightness, turnAmount);
        pageStrip.backLight.style.backgroundColor = stripLightColor(-frontBrightness, turnAmount);
      });
    } else {
      // фольга переливается от наклона: слои только сдвигаются, без перерисовки
      const tiltStrength = clamp((Math.abs(totalTiltX) + Math.abs(totalTiltY)) / 13, 0, 1);
      const fadeIn = clamp((time - solidActivatedTime) / 600, 0, 1);
      const foilOpacity = solidHasFoilMask ? 0.4 + tiltStrength * 0.45 : 0.05 + tiltStrength * 0.15;
      cardFoil.style.opacity = (foilOpacity * fadeIn).toFixed(3);
      cardGlare.style.opacity = ((0.3 + tiltStrength * 0.3) * fadeIn).toFixed(3);
      cardFoilSheen.style.transform =
        `translate3d(${(totalTiltY * cardWidth * 0.03).toFixed(1)}px, ${(-totalTiltX * cardHeight * 0.03).toFixed(1)}px, 0)`;
      cardGlareSpot.style.transform =
        `translate3d(${(totalTiltY * cardWidth * 0.042).toFixed(1)}px, ${((-0.1 - totalTiltX * 0.05) * cardHeight).toFixed(1)}px, 0)`;
      // край, который уходит от зрителя, темнеет — так видно, куда наклонена карточка
      edgeShades.right.style.opacity = (clamp(totalTiltY / 13, 0, 1) * fadeIn).toFixed(3);
      edgeShades.left.style.opacity = (clamp(-totalTiltY / 13, 0, 1) * fadeIn).toFixed(3);
      edgeShades.top.style.opacity = (clamp(totalTiltX / 11, 0, 1) * fadeIn).toFixed(3);
      edgeShades.bottom.style.opacity = (clamp(-totalTiltX / 11, 0, 1) * fadeIn).toFixed(3);
    }

    // тень, которую карточка отбрасывает на фон позади себя
    const castFade = isEntranceDone ? clamp((time - entranceDoneTime) / 700, 0, 1) : 0;
    cardCastShadow.style.opacity = (castFade * (0.45 + 0.55 * projectedWidth) * (1 - liftAmount * 0.25)).toFixed(3);
    // тень падает вниз и чуть вправо по экрану, как бы ни была повёрнута карточка
    const shadowRight = cardWidth * (0.025 + liftAmount * 0.03), shadowDown = cardHeight * (0.045 + liftAmount * 0.06);
    const shadowOffset = isCardSideways ? { x: shadowDown, y: -shadowRight } : { x: shadowRight, y: shadowDown };
    cardCastShadow.style.transform =
      `translate3d(${shadowOffset.x.toFixed(1)}px, ${shadowOffset.y.toFixed(1)}px, ${(-cardWidth * 0.1).toFixed(1)}px) ` +
      `scaleX(${Math.max(0.04, projectedWidth).toFixed(3)})`;

    const shadowOpacity = (Math.min(1, entranceScale) * (0.9 - liftAmount * 0.45)).toFixed(2);
    const shadowScale = (entranceScale * (0.35 + 0.65 * projectedWidth + liftAmount * 0.18)).toFixed(3);
    if (shadowOpacity + shadowScale !== lastShadowStyle) {
      lastShadowStyle = shadowOpacity + shadowScale;
      cardShadow.style.opacity = shadowOpacity;
      cardShadow.style.transform = `scale(${shadowScale}, ${(entranceScale * (1 + liftAmount * 0.18)).toFixed(3)})`;
    }
    requestAnimationFrame(animateCard);
  }
  requestAnimationFrame(animateCard);

  function onEntranceComplete() {
    setTimeout(() => document.body.classList.add("is-ready"), 500);
  }

  /* ---------- Открытие подарка ---------- */
  const giftGate = document.getElementById("gift-gate");
  const giftSealWrap = document.getElementById("gift-seal-wrap");
  const giftSealArt = document.getElementById("gift-seal-art");
  const screenFlash = document.getElementById("screen-flash");
  const shockwaves = [document.getElementById("shockwave")];
  let isGiftOpened = false;

  async function openGift() {
    if (isGiftOpened) return;
    isGiftOpened = true;
    enableGyroscope(); // на iPhone разрешение можно запросить только по нажатию
    giftGate.classList.add("is-charging");
    if (giftSealArt.getAnimations) {
      giftSealArt.getAnimations().forEach(animation => {
        if (animation.updatePlaybackRate) animation.updatePlaybackRate(14); else animation.playbackRate = 14;
      });
    }
    const sealRectangle = giftSealWrap.getBoundingClientRect();
    const sealCenterX = sealRectangle.left + sealRectangle.width / 2;
    const sealCenterY = sealRectangle.top + sealRectangle.height / 2;
    spawnConvergingSparkles(sealCenterX, sealCenterY, 30, 46);
    if (navigator.vibrate) navigator.vibrate(8);

    await Promise.all([wait(prefersReducedMotion ? 0 : 760), Promise.race([assetsReady, wait(2500)])]);

    screenFlash.classList.add("is-flashing");
    shockwaves.forEach(shockwave => shockwave.classList.add("is-active"));
    spawnSparkleBurst(innerWidth / 2, innerHeight / 2, 36, 1.1);
    document.body.classList.add("is-revealed");
    entranceStartTime = performance.now();
    if (navigator.vibrate) navigator.vibrate([25, 40, 35]);
  }
  giftGate.addEventListener("click", openGift);
  giftGate.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openGift(); }
  });
  giftGate.focus({ preventScroll: true });
})();
</script>
